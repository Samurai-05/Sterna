services:
  web:
    build: ./deploy/placeholder
    image: ghcr.io/samurai-05/sterna-web:latest
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped
    networks:
      - app_network

  # NestJS API — production definition.
  #
  # Runs the prebuilt image published by .github/workflows/deploy.yml. No port
  # is published: per ADR-007 the API is only reachable through Nginx over the
  # internal Compose network. Everything needed for local development (source
  # bind mount, published port, watch mode) lives in docker-compose.override.yml,
  # which Compose loads automatically on a developer machine.
  api:
    image: ghcr.io/samurai-05/sterna-api:latest
    container_name: app_api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      # Service names, not localhost: inside the Compose network `postgres`
      # resolves to the database container.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - app_network

  postgres:
    image: postgis/postgis:16-3.4
    container_name: app_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # $$ escapes the expansion so it is resolved by the shell inside the
      # container (from the variables set above), not by Compose on the host.
      # Quoted so a missing value fails as an empty argument instead of letting
      # -U swallow the -d flag and hang the check forever.
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  minio:
    image: minio/minio:latest
    container_name: app_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  # One-shot service to auto-create the default bucket on startup,
  # so no manual step is required after `docker compose up`.
  minio-init:
    image: minio/mc:latest
    container_name: app_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      mc mb -p local/${MINIO_BUCKET_NAME};
      exit 0;
      "
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
