services:
  # Nginx — the public entry point (ADR-007): serves the built frontend,
  # terminates TLS and reverse proxies /api to the API container.
  #
  # No build: here. Like the api service, this runs the prebuilt image published
  # by .github/workflows/deploy.yml; the local build lives in the override file.
  #
  # The ports default to 80/443 for the VM. A developer cannot bind those
  # without root, so .env sets 8080/8443 locally. They are set through variables
  # rather than overridden in docker-compose.override.yml because Compose
  # *appends* to sequences when merging, which would publish both pairs.
  web:
    image: ghcr.io/samurai-05/sterna-web:latest
    container_name: app_web
    restart: unless-stopped
    environment:
      # Substituted into the Nginx config at container start, and the name the
      # certificate is issued for.
      SERVER_NAME: ${SERVER_NAME:-localhost}
    ports:
      - "${WEB_PORT:-80}:80"
      - "${WEB_TLS_PORT:-443}:443"
    volumes:
      # Shared with certbot: it writes certificates here, Nginx reads them.
      - certbot_conf:/etc/letsencrypt
      # Shared with certbot: it drops ACME challenge files here, Nginx serves them.
      - certbot_www:/var/www/certbot
    # The command is deliberately left as the image's default. The entrypoint
    # only runs /docker-entrypoint.d/ when its first argument is exactly
    # "nginx", so overriding it here would skip the certificate bootstrap and
    # the envsubst templating. Reloading for renewals is handled inside the
    # image instead, by 40-reload-for-renewals.sh.
    networks:
      - app_network

  # Obtains and renews the Let's Encrypt certificate over the HTTP-01 challenge.
  #
  # Issuance is a one-time manual step (see docs/CONTRIBUTING.md); this service
  # only handles renewal. `certbot renew` is a no-op until the certificate is
  # inside its last 30 days, so almost every run does nothing, which is why
  # twice a day is both harmless and the interval certbot itself recommends.
  certbot:
    image: certbot/certbot:latest
    container_name: app_certbot
    restart: unless-stopped
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: >
      /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"
    networks:
      - app_network

  # NestJS API — production definition.
  #
  # Runs the prebuilt image published by .github/workflows/deploy.yml. No port
  # is published: per ADR-007 the API is only reachable through Nginx over the
  # internal Compose network. Everything needed for local development (source
  # bind mount, published port, watch mode) lives in docker-compose.override.yml,
  # which Compose loads automatically on a developer machine.
  api:
    image: ghcr.io/samurai-05/sterna-api:latest
    container_name: app_api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      # Service names, not localhost: inside the Compose network `postgres`
      # resolves to the database container.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Signing key for the JWT access tokens (ADR-009). The API refuses to
      # boot if it is missing or shorter than 32 characters.
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN_SECONDS: ${JWT_EXPIRES_IN_SECONDS:-604800}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME}
      # Rate limits (api/src/config/throttling.ts). Unset means the
      # production defaults compiled into that file; the override file relaxes
      # them for development, where the e2e suite logs in dozens of times from
      # one source.
      THROTTLE_TTL_SECONDS: ${THROTTLE_TTL_SECONDS:-60}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-240}
      AUTH_THROTTLE_TTL_SECONDS: ${AUTH_THROTTLE_TTL_SECONDS:-900}
      AUTH_THROTTLE_LIMIT: ${AUTH_THROTTLE_LIMIT:-10}
      UPLOAD_THROTTLE_TTL_SECONDS: ${UPLOAD_THROTTLE_TTL_SECONDS:-600}
      UPLOAD_THROTTLE_LIMIT: ${UPLOAD_THROTTLE_LIMIT:-30}
      # Publishing /api/docs. Unset means "not in production"; set it to true
      # to expose the OpenAPI document on the VM for a demo.
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - app_network

  postgres:
    image: postgis/postgis:16-3.4
    container_name: app_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/bootstrap:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # $$ escapes the expansion so it is resolved by the shell inside the
      # container (from the variables set above), not by Compose on the host.
      # Quoted so a missing value fails as an empty argument instead of letting
      # -U swallow the -d flag and hang the check forever.
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  minio:
    image: minio/minio:latest
    container_name: app_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    # Deliberately no ports: ADR-007 keeps infrastructure services off the
    # public network, and this VM has a routable address. Photos reach clients
    # through the authenticated /api/photos/:id route, so nothing outside the
    # Compose network needs MinIO. The console is published for local
    # development only, in docker-compose.override.yml.
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  # One-shot service to auto-create the default bucket on startup,
  # so no manual step is required after `docker compose up`.
  minio-init:
    image: minio/mc:latest
    container_name: app_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      mc mb -p local/${MINIO_BUCKET_NAME};
      exit 0;
      "
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  # /etc/letsencrypt — the certificates and the certbot account. Losing this
  # volume means re-issuing, so it must survive `docker compose down`.
  certbot_conf:
  # The ACME challenge webroot, written by certbot and served by Nginx.
  certbot_www:
