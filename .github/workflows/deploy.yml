name: Deploy

on:
  push:
    branches: [main]

env:
  IMAGE: ghcr.io/samurai-05/sterna-web
  API_IMAGE: ghcr.io/samurai-05/sterna-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./deploy/placeholder
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  build-and-push-api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./api
          # Runtime image only: compiled dist/ plus production dependencies.
          # The `development` target (watch mode, dev dependencies) must never
          # be deployed.
          target: production
          push: true
          tags: |
            ${{ env.API_IMAGE }}:latest
            ${{ env.API_IMAGE }}:${{ github.sha }}

  deploy:
    needs: [build-and-push, build-and-push-api]
    runs-on: self-hosted
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -f docker-compose.yml is deliberate: the repository checkout also
      # contains docker-compose.override.yml, which Compose would otherwise
      # load automatically and turn this into a development deployment.
      - name: Pull and restart
        run: |
          docker compose -f docker-compose.yml pull
          docker compose -f docker-compose.yml up -d
          docker image prune -f

      - name: Verify the API is healthy
        run: |
          for _ in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' app_api 2>/dev/null || echo starting)
            case "$status" in
              healthy)
                echo "API reported healthy"
                exit 0
                ;;
              unhealthy)
                echo "API reported unhealthy"
                docker compose -f docker-compose.yml logs api --tail 50
                exit 1
                ;;
            esac
            sleep 5
          done
          echo "API did not become healthy within 150s"
          docker compose -f docker-compose.yml logs api --tail 50
          exit 1
