# Local development overrides.
#
# Compose loads this file automatically alongside docker-compose.yml, so a
# plain `docker compose up` gives you the development setup with no extra
# flags. The deployment workflow deliberately passes `-f docker-compose.yml`
# so the VM ignores everything in here.
#
# Overrides can only add to or replace values from the base file, never remove
# them — which is why the base file holds the leaner production definition and
# the development extras live here.

services:
  # Build the Nginx entry point locally instead of pulling the published image.
  # The separate tag keeps this from overwriting the ghcr.io :latest tag, and
  # pull_policy stops Compose from ever reaching for a registry copy.
  #
  # Local ports come from .env (WEB_PORT=8080, WEB_TLS_PORT=8443): binding 80
  # and 443 needs root on Linux. The certificate is the self-signed one the
  # image mints on first boot, so expect a browser warning on https://localhost:8443.
  web:
    image: sterna-web:dev
    pull_policy: build
    build:
      context: ./frontend
      target: production

  # The MinIO console is useful while developing and must not be reachable on
  # the VM, so these ports live here rather than in the base file.
  minio:
    ports:
      - "9000:9000"
      - "9001:9001"

  api:
    # Build locally from the Dockerfile's `development` target instead of
    # pulling the published production image. The separate tag keeps the local
    # development build from overwriting the `ghcr.io/...:latest` tag, and
    # pull_policy stops Compose from ever reaching for a registry copy.
    image: sterna-api:dev
    pull_policy: build
    build:
      context: ./api
      target: development
    environment:
      NODE_ENV: development
    # Published so you can reach the API directly from the host during
    # development; in production only Nginx talks to it.
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      # Source bind mount: `nest start --watch` recompiles on save.
      - ./api:/app
      # Anonymous volume: keeps the image's node_modules instead of letting
      # the bind mount hide it behind the host's.
      - /app/node_modules
