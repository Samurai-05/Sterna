# Security headers for every response the application serves.
#
# Included rather than written once at server level on purpose: nginx does not
# inherit `add_header` into a location block that declares its own, and four
# location blocks below set Cache-Control. Without the repeated include, the
# service worker, the manifest and everything under /assets/ would ship with
# no security headers at all.
#
# `always` on each one so they are present on error responses too — a 502 from
# the API is exactly when a browser should still be refusing to sniff types or
# frame the page.

# The app is HTTPS-only in production (NFR-23) and port 80 already redirects.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# frame-ancestors in the CSP below is the modern equivalent; this covers the
# browsers that do not implement it.
add_header X-Frame-Options "DENY" always;

# The map and the search screen use the browser's geolocation, and the Android
# build asks for the camera to scan a group's QR code. Nothing else is used.
add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=(), payment=()" always;

# Content-Security-Policy, derived from what the application actually loads:
#
#   style-src   'unsafe-inline' is required — MapLibre GL writes inline styles
#               for its controls and markers. fonts.googleapis.com is the
#               @import at the top of frontend/src/index.css.
#   font-src    where that stylesheet then fetches the font files from.
#   img-src     blob: for the object URLs the app builds from photo bytes
#               (an <img src="/api/photos/..."> cannot carry a bearer token),
#               data: for inlined icons. tiles.openfreemap.org appears here as
#               well as in connect-src because the basemap's sprite sheet and
#               its ne2_shaded raster source are images, and which of fetch or
#               Image MapLibre uses for them varies by version.
#               images.unsplash.com is only there for the stock-photo
#               fallback in DiscoveryPhoto/api.ts, which paints the same
#               Unsplash image on every card before the real photo loads.
#               Drop it from this list the moment that fallback goes.
#   connect-src the API is same-origin behind this server. The basemap style,
#               its vector tiles and its glyph ranges all come from
#               tiles.openfreemap.org (ADR-002) — verified against the style
#               JSON, which references no other host.
#   worker-src  MapLibre runs its parser in a worker; Vite serves it
#               same-origin, and blob: covers the worker-from-blob fallback.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; manifest-src 'self'; script-src 'self'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://tiles.openfreemap.org https://images.unsplash.com; connect-src 'self' https://tiles.openfreemap.org; upgrade-insecure-requests" always;
